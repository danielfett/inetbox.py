[tool.poetry]
name = "inetbox-py"
version = "0.4"
description = ""
authors = ["Daniel Fett <fett@danielfett.de>"]
readme = "README.md"
packages = [{include = "inetbox"}]

[tool.poetry.dependencies]
python = "^3.9"
pyserial = "^3.5"
# 1.4.0 is the first release with Service._wait_for_work() and the
# incoming-message queue; against anything older the service refuses to
# start rather than never read the LIN bus - see TrumaService.__init__.
miqro = "^1.4.0"
bitstruct = "^8.15.1"
paho-mqtt = {version = "^1.6.1", optional = true}
python-dateutil = ">2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
truma_service = ["paho-mqtt"]

[tool.poetry.scripts]
truma_service = { callable = "inetbox:truma_service.run", extras = ["truma_service"]}
